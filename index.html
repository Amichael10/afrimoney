<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AfriPay Directory — African Mobile Money Providers</title>
    <meta name="description" content="The most comprehensive open-source directory of mobile money providers across Africa. Built for developers and designers." />
    <meta property="og:title" content="AfriPay Directory — African Mobile Money Providers" />
    <meta property="og:description" content="Open-source directory of 150+ mobile money providers across 50+ African countries." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
